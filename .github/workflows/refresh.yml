# 주가·뉴스·주식 수 자동 갱신 — 하루 2번
#   ① 다음 날 아침 (화~토 11:30 UTC = 뉴욕 07:30 EDT / 06:30 EST): 전날 종가
#      Nasdaq 일봉 표는 장 마감 뒤 몇 시간이 지나야 그날 행이 올라옴 (2026-10-16 확인: 20:37 EDT 실행은 전날까지만,
#      다음 날 낮엔 들어와 있음) → 장 마감 직후에만 돌면 사이트 주가가 늘 1~2 거래일 늦고, 금요일 종가는 월요일 밤에야 들어왔음
#   ② 장 마감 직후 (월~금 22:30 UTC = 뉴욕 17:30 EST / 18:30 EDT): 그날 회사 공시·언론 (그날 종가는 ①이 다음 날 받음)
#   GitHub 예약 실행은 붐비면 1~3시간 늦게 돌기도 함 (실제 22:30 예약이 00:37~01:20 UTC 에 돎)
# scripts/fetch-stock.mjs, fetch-news.mjs, fetch-shares.mjs 가 public/data/stock.json·news.json·shares.json(+ data/shares.json) 을 고치고,
# 바뀐 게 있으면 커밋·푸시 → Vercel 이 자동 배포. 소스가 막히면 스크립트가 기존 파일을 그대로 두고 0 으로 끝남.
# 같은 날 두 번 돌아도 바뀐 게 없으면 커밋하지 않음 (증분 병합이라 결과가 같음)
name: refresh-data
on:
  schedule:
    - cron: '30 11 * * 2-6'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # 기준일 뒤 새 회사 공시가 있으면 이슈를 열고·고치고·닫음 (scripts/check-asof.mjs)
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts   # 스크립트가 zod 를 쓰므로 설치는 필요, predev/prebuild 훅은 불필요
      - run: node scripts/fetch-stock.mjs
      - run: node scripts/fetch-news.mjs --max=60
      - run: node scripts/fetch-shares.mjs   # 새 10-Q·10-K 표지 주식 수를 SEC XBRL 에서 덧붙임
      - name: 기준일 뒤 새 회사 공시 확인 (현황 페이지 안내 파일 + GitHub 이슈)
        run: node scripts/check-asof.mjs --issue
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 바뀐 파일만 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stock.json public/data/news.json data/shares.json public/data/shares.json public/data/asof-check.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 주가·뉴스·주식 수 자동 갱신 $(date -u +%F)"
          git pull --rebase origin main
          git push
