# 주가·뉴스·주식 수 자동 갱신 — 하루 2번
#   ① 다음 날 아침 (화~토 11:30 UTC = 뉴욕 07:30 EDT / 06:30 EST): 전날 종가
#      Nasdaq 일봉 표는 장 마감 뒤 몇 시간이 지나야 그날 행이 올라옴 (2026-10-16 확인: 20:37 EDT 실행은 전날까지만,
#      다음 날 낮엔 들어와 있음) → 장 마감 직후에만 돌면 사이트 주가가 늘 1~2 거래일 늦고, 금요일 종가는 월요일 밤에야 들어왔음
#   ② 장 마감 직후 (월~금 22:30 UTC = 뉴욕 17:30 EST / 18:30 EDT): 그날 회사 공시·언론 (그날 종가는 ①이 다음 날 받음)
#   GitHub 예약 실행은 붐비면 1~3시간 늦게 돌기도 함 (실제 22:30 예약이 00:37~01:20 UTC 에 돎)
# scripts/fetch-stock.mjs, fetch-news.mjs, fetch-shares.mjs 가 public/data/stock.json·news.json·shares.json(+ data/shares.json) 을 고치고,
# 바뀐 게 있으면 커밋·푸시 → Vercel 이 자동 배포. 소스가 막히면 스크립트가 기존 파일을 그대로 두고 0 으로 끝남.
# 같은 날 두 번 돌아도 바뀐 게 없으면 커밋하지 않음 (증분 병합이라 결과가 같음)
# 언론 제목 기계 번역(Kanana 1.5 · CPU): 새 제목만 번역 (회사 발표 헤드라인은 오역 위험으로 번역하지 않음)
#   → 검사기(숫자·금액·티커·이름)를 통과한 것만 public/data/news-ko.json
#   → 뜻 판정(Qwen3-4B · CPU bf16, 2026-10-28): 새 번역에 점수를 매겨 낮으면 뺌 (한 번에 15개까지, 남으면 다음 실행)
#   번역·판정 단계가 실패해도 주가·뉴스 갱신은 그대로 커밋됨 (continue-on-error) — 판정이 실패하면 규칙 검사만 통과한 번역이 보임
name: refresh-data
on:
  schedule:
    - cron: '30 11 * * 2-6'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # 기준일 뒤 새 회사 공시가 있으면 이슈를 열고·고치고·닫음 (scripts/check-asof.mjs)
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 번역(최대 25분) + 판정(최대 20분) + 받기·커밋
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts   # 스크립트가 zod 를 쓰므로 설치는 필요, predev/prebuild 훅은 불필요
      - run: node scripts/fetch-stock.mjs
      - run: node scripts/fetch-news.mjs --max=60
      - run: node scripts/fetch-shares.mjs   # 새 10-Q·10-K 표지 주식 수를 SEC XBRL 에서 덧붙임
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/translate/requirements.txt
      - name: 기계 번역 준비 (CPU 판 torch + transformers 4.x)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/translate/requirements.txt
      # 모델 캐시는 모델마다 따로 (저장소 캐시 한도 10GB — Kanana 약 3GB + Qwen 약 6GB, 압축 뒤)
      #   예전 키(hf-kanana-1.5-2.1b-instruct-2505)는 hub 폴더 전체라 판정 모델까지 담을 수 있어 경로를 좁힘
      - name: 번역 모델 캐시 (Kanana 1.5, 약 4.6GB — 한 번 받으면 다시 받지 않음)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--kakaocorp--kanana-1.5-2.1b-instruct-2505
          key: hf-model-kanana-1.5-2.1b-instruct-2505
      - name: 판정 모델 캐시 (Qwen3-4B-Instruct-2507, 약 8GB — 판 고정)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen3-4B-Instruct-2507
          key: hf-model-qwen3-4b-instruct-2507-cdbee75
      - name: 언론 제목 기계 번역 (새 제목만 · 실패해도 계속)
        continue-on-error: true
        timeout-minutes: 25
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python scripts/translate/translate_titles.py --out "$RUNNER_TEMP/ko-raw.json" --max 60
          node scripts/apply-translations.mjs "$RUNNER_TEMP/ko-raw.json"
      - name: 번역 뜻 판정 (점수 없는 번역 15개까지 · 실패해도 계속)
        continue-on-error: true
        timeout-minutes: 20
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python scripts/translate/judge_titles.py --out "$RUNNER_TEMP/judge.json" --max 15
          node scripts/apply-translations.mjs --judge "$RUNNER_TEMP/judge.json"
      - name: 기준일 뒤 새 회사 공시 확인 (현황 페이지 안내 파일 + GitHub 이슈)
        run: node scripts/check-asof.mjs --issue
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 바뀐 파일만 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stock.json public/data/news.json public/data/news-ko.json data/shares.json public/data/shares.json public/data/asof-check.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: 주가·뉴스·주식 수 자동 갱신 $(date -u +%F)"
          git pull --rebase origin main
          git push
