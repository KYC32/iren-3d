<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IREN 3D — 데이터센터 현황판</title>
    <meta name="description" content="IREN(NASDAQ: IREN)의 데이터센터 사이트 현황(가동·건설·예정)을 전략게임풍 3D로 보여주는 비공식 대시보드" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 지도 타일 서버에 미리 연결(DNS·TLS) — 첫 지도 표시를 앞당김 -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- 지도 스타일(작은 JSON, 하루 캐시)을 미리 받아 둠 — 지도 코드가 준비되자마자 바로 씀 -->
    <link rel="preload" href="https://tiles.openfreemap.org/styles/positron" as="fetch" crossorigin="anonymous" />
    <!-- 링크 공유(X·카카오톡 등) 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IREN 3D — 데이터센터 현황판" />
    <meta property="og:description" content="IREN 사이트 9곳(5.6GW)의 가동·건설·계획 현황을 전략게임풍 3D로. 비공식·공개자료 기반." />
    <meta property="og:url" content="https://iren-3d.vercel.app/" />
    <meta property="og:image" content="https://iren-3d.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://iren-3d.vercel.app/og.jpg" />
    <meta name="theme-color" content="#eceffa" />
  </head>
  <body>
    <!-- 부팅 화면: 지도 코드(약 430KB)를 받는 동안 보이는 GPU 랙 그림 (scripts/anatomy/rack/build.mjs 가 만든 src/boot/rack.html 을 빌드 때 끼워 넣음)
         지도가 준비되면 window.__bootReady() 가 불리고, 사용자가 그림을 만지고 있지 않으면 바로 지도로 넘어감 -->
    <style>
      /* 부팅 화면: 카드가 화면보다 크면 스크롤 (margin:auto 로 가운데 정렬해야 위가 잘리지 않음) */
      #boot{position:fixed;inset:0;z-index:200;display:flex;overflow:auto;padding:16px;background:#eceffa;color:#16213a;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity 480ms ease}
      #boot.is-done{opacity:0;pointer-events:none}
      #boot .boot-card{margin:auto;width:min(1120px,100%);background:#fbfbfa;border:1px solid rgba(20,30,60,.08);border-radius:16px;box-shadow:0 6px 24px rgba(30,45,90,.08);padding:14px 18px 12px}
      #boot h1{margin:0;font-size:15px;font-weight:700}
      #boot .boot-sub{margin:2px 0 10px;font-size:12.5px;color:#5b6581;line-height:1.5}
      #boot .boot-sub b{color:#16213a;font-weight:700}
      #boot .boot-note{margin:8px 0 0;font-size:11px;color:#6b7591;line-height:1.5}
      /* 지도까지 남은 시간 막대 (최소 표시 시간 동안 차오름) */
      #boot .boot-bar{height:3px;border-radius:2px;background:#e3e7f2;overflow:hidden;margin-top:8px}
      #boot .boot-bar i{display:block;height:100%;width:0;background:#2ea88a}
      /* is-timing 은 화면이 실제로 보이기 시작할 때 붙음 (백그라운드 탭으로 열면 나중에) → 그때부터 차오름 */
      #boot.is-timing .boot-bar i{animation:boot-fill var(--boot-min,14s) linear forwards}
      @keyframes boot-fill{to{width:100%}}
      @media (prefers-reduced-motion:reduce){#boot .boot-bar i,#boot.is-timing .boot-bar i{animation:none;width:100%;opacity:.35}}
      /* 그림 크기: 화면 높이에 맞춰 제한. 두 그림의 가로:세로 비율(--rk-a1 랙, --rk-a2 GPU)은 빌드가 조각 안에 넣어 줌 */
      /* margin-top:auto = 그림을 칸 아래쪽(수치 줄 바로 위)에 붙임, 좌우 auto = 가운데 */
      #boot .rk-fig .rk-stage{margin:auto auto 0;max-width:calc((100dvh - 250px) * var(--rk-a1, 1.143))}
      #boot .rk-fig .rk-stage[data-fig=gpu]{max-width:calc((100dvh - 250px) * var(--rk-a2, 1.3))}
      @media (max-width:767px){
        #boot{padding:10px}#boot .boot-card{padding:10px 10px 8px}
        /* 위아래로 쌓을 때: 두 그림을 같은 폭 w 로 → 높이 합 = w/a1 + w/a2 가 (화면 높이 − 글자 340px) 안에 */
        #boot .rk-fig .rk-stage,#boot .rk-fig .rk-stage[data-fig=gpu]{max-width:calc((100dvh - 340px) / (1 / var(--rk-a1, 1.143) + 1 / var(--rk-a2, 1.3)))}
      }
    </style>
    <div id="boot" aria-live="polite">
      <div class="boot-card">
        <h1>IREN 3D 현황판</h1>
        <p class="boot-sub">AI 데이터센터의 기본 단위부터 — 랙 1대 = GPU 72개 ≈ 130 kW, 그래서 50 MW 홀은 랙 약 350대. 그림이 저절로 부품을 확대해 보여 주고, <b>확대</b> 단추로 직접 살펴볼 수도 있습니다.</p>
        <!-- rack -->
        <div class="boot-bar" aria-hidden="true"><i></i></div>
        <p class="boot-note">GB300 NVL72 랙·B300 GPU 의 도식 (실측 모형 아님). 색은 실물 기준: 구리 냉각판, 검정 기판·호스, 은색 판금. 파랑·빨강 고리 = 냉각수 공급·회수 연결부, 주황 = 열. 비공식 리서치 · 투자 조언 아님.</p>
      </div>
    </div>
    <script>
      // 부팅 화면 넘김 규칙
      //   - 최소 MIN 동안은 보여 줌 (그림의 둘러보기 한 바퀴: 트레이 꺼냄·확대 → 냉각판 들림·기판 확대 → 원위치)
      //     이 시간은 화면이 "실제로 보이기 시작한 때"부터 셈: 링크를 백그라운드 탭으로 열면
      //     안 보는 사이에 시간이 다 흘러 탭을 열자마자 그림이 사라지는 일을 막음
      //   - 지도(또는 3D·주가·뉴스 페이지)가 준비되면 앱이 __bootReady() 를 부름
      //   - 그림을 만지는 중이면 손을 뗀 뒤 IDLE 만큼 기다림
      //   - "건너뛰기 / 지도 보기" 버튼은 언제든 바로 넘김
      (function () {
        var MIN = window.__rackCycle || 14000, IDLE = 6000;   // 최소 = 그림 둘러보기 한 바퀴 (랙 → GPU 확대까지, 그림이 알려 줌)
        var boot = document.getElementById('boot'), go = boot && boot.querySelector('[data-boot-go]');
        var t0 = 0, lastTouch = 0, ready = false, done = false, timer = 0;
        if (boot) boot.style.setProperty('--boot-min', MIN / 1000 + 's');
        // 화면이 보이는 첫 순간에 시계 시작 (진행 막대도 이때부터 차오름)
        function startClock() {
          if (t0 || document.hidden) return;
          t0 = Date.now();
          if (boot) boot.classList.add('is-timing');
        }
        startClock();
        document.addEventListener('visibilitychange', startClock);
        function dismiss() {
          if (done || !boot) return; done = true; clearInterval(timer);
          document.removeEventListener('visibilitychange', startClock);
          boot.classList.add('is-done');
          setTimeout(function () { if (window.__rackStop) window.__rackStop(); boot.remove(); }, 500);
        }
        function tryGo() {
          if (done || !ready || !t0) return; // 아직 한 번도 안 보였으면 기다림
          if (window.__rackBusy && window.__rackBusy()) return; // GPU 기판을 확대해 보는 중이면 기다림 (버튼으로는 언제든 넘김)
          // 그림 둘러보기가 한 바퀴를 다 돌 때까지 (느린 기기에선 시계가 늦게 감). 늦어도 MIN 의 두 배가 지나면 넘김
          if (window.__rackLoops && window.__rackLoops() < 1 && Date.now() - t0 < MIN * 2) return;
          if (Date.now() - t0 < MIN || Date.now() - lastTouch < IDLE) return;
          dismiss();
        }
        window.__bootReady = function () {
          if (ready) return; ready = true;
          if (go) go.textContent = '지도 보기 →';
          tryGo();
        };
        timer = setInterval(tryGo, 400);
        ['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach(function (ev) { if (boot) boot.addEventListener(ev, function () { lastTouch = Date.now(); }, { passive: true }); });
        if (go) go.addEventListener('click', dismiss);
        // 주가·뉴스 페이지 링크로 들어오면 그림 없이 바로
        if (/page=/.test(location.hash)) dismiss();
        // 안전장치: 30초가 지나도 신호가 없으면 준비된 것으로 봄 (지도 서버 장애 등)
        setTimeout(function () { window.__bootReady(); }, 30000);
      })();
    </script>
    <!-- React가 이 div 안에 전체 앱을 그립니다 -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
